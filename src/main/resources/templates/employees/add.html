<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>
</head>

<body>

<h1>Thêm nhân viên</h1>

<form th:action="@{/employees/add}"
      th:object="${employeeRequest}"
      method="post">

    <div>
        <label>Tên:</label>
        <input type="text" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></span>
    </div>

    <br>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}">
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
    </div>

    <br>

    <div>
        <label>Phòng ban:</label>

        <select th:field="*{departmentId}">
            <option value="">-- Chọn phòng ban --</option>

            <option th:each="department : ${departments}"
                    th:value="${department.id}"
                    th:text="${department.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}" style="color: red;"></span>
    </div>

    <br>

    <button type="submit">Thêm</button>

</form>

<br>

<a href="/employees/list">Quay lại danh sách</a>

</body>
</html>
